spring.application.name=Distributed-Job-scheduler-and-Task-Queue-Engine

spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=20

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

spring.kafka.bootstrap-servers=localhost:9092
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.threads.virtual.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus

logging.level.com.Ballthoven.Distributed.Job.scheduler.and.Task.Queue.Engine=DEBUG
jobforge.poller.enabled=true
jobforge.poller.interval=PT0.5S
jobforge.worker.threads=8
jobforge.worker.queue-capacity=64
jobforge.worker.lease=30s
jobforge.worker.shutdown-timeout=30s




